<!doctype html>
<html lang="zh-CN" data-theme="winter">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Piano Tutor</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <div class="brand">
          <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
            <rect x="6" y="8" width="36" height="32" rx="2" fill="none" stroke="currentColor" stroke-width="2" />
            <path d="M14 8v32M22 8v20M30 8v20M38 8v32M22 28h16" fill="none" stroke="currentColor" stroke-width="2" />
          </svg>
          <div>
            <h1 data-i18n="appTitle"></h1>
          </div>
        </div>
        <div class="header-end">
          <p id="status" role="status"></p>
          <div class="dropdown dropdown-end">
            <button id="langButton" class="btn btn-ghost btn-sm btn-square" type="button" data-i18n-aria="language"></button>
            <ul tabindex="0" class="dropdown-content menu lang-menu">
              <li><button id="langZh" type="button">中文</button></li>
              <li><button id="langEn" type="button">English</button></li>
            </ul>
          </div>
        </div>
      </header>

      <section id="welcome">
        <div class="library" id="libraryHome">
          <div class="library-top">
            <div class="library-head">
              <div class="library-title-row">
                <h2 data-i18n="library"></h2>
                <span id="libraryCount"></span>
              </div>
              <p data-i18n="libraryHint"></p>
            </div>
            <div class="dropdown dropdown-end">
              <button id="addMenu" class="btn btn-primary btn-sm" type="button" data-i18n="addPiece"></button>
              <ul tabindex="0" class="dropdown-content menu add-menu">
                <li>
                  <button id="pickXml" type="button">
                    <span class="add-copy"><strong>MusicXML</strong><small data-i18n="addXml"></small></span>
                  </button>
                </li>
                <li>
                  <button id="pickMidi" type="button">
                    <span class="add-copy"><strong>MIDI</strong><small data-i18n="addMidi"></small></span>
                  </button>
                </li>
                <li>
                  <button id="pickPhoto" type="button">
                    <span class="add-copy"><strong data-i18n="addPhoto"></strong><small data-i18n="addPhotoHint"></small></span>
                  </button>
                </li>
                <li>
                  <button id="improvStart" type="button">
                    <span class="add-copy"><strong data-i18n="addImprov"></strong><small data-i18n="addImprovHint"></small></span>
                  </button>
                </li>
              </ul>
            </div>
          </div>
          <div class="library-tools">
            <input id="libraryQuery" class="input input-bordered input-sm" type="search" data-i18n-placeholder="searchPlaceholder" data-i18n-aria="searchLabel" />
            <div class="filters" role="tablist" data-i18n-aria="filterLabel">
              <button class="filter-tab" type="button" role="tab" data-filter="all" aria-selected="true" data-i18n="filterAll"></button>
              <button class="filter-tab" type="button" role="tab" data-filter="score" aria-selected="false" data-i18n="filterScore"></button>
              <button class="filter-tab" type="button" role="tab" data-filter="photo" aria-selected="false" data-i18n="filterPhoto"></button>
              <button class="filter-tab" type="button" role="tab" data-filter="midi" aria-selected="false" data-i18n="filterMidi">MIDI</button>
              <button class="filter-tab" type="button" role="tab" data-filter="improv" aria-selected="false" data-i18n="filterImprov"></button>
            </div>
          </div>
          <input id="xmlFile" type="file" accept=".xml,.musicxml,application/xml" hidden />
          <input id="midiFile" type="file" accept=".mid,.midi,audio/midi,audio/mid" hidden />
          <input id="photoFile" type="file" accept="image/*" multiple hidden />
          <input id="pageReplaceFile" type="file" accept="image/*" hidden />
          <div id="pieceList" class="piece-list"></div>
        </div>
        <div class="library improv" id="improvPanel" hidden>
          <h2 data-i18n="improvTitle"></h2>
          <p data-i18n="improvHint"></p>
          <p id="improvClock" class="improv-clock">0:00</p>
          <div class="row">
            <button id="improvStop" class="btn btn-primary" type="button" data-i18n="improvStop"></button>
            <button id="improvCancel" class="btn btn-ghost" type="button" data-i18n="cancel"></button>
          </div>
        </div>
      </section>

      <section id="workspace" hidden>
        <div class="transport">
          <div class="transport-start">
            <div class="tooltip tooltip-bottom" data-i18n-tip="back">
              <button id="back" class="btn btn-ghost btn-sm btn-square" type="button" data-i18n-aria="back"></button>
            </div>
            <button id="pieceTitle" class="piece-title" type="button" data-i18n-title="editTitle"></button>
            <input id="pieceTitleInput" class="piece-title-input" hidden maxlength="40" data-i18n-aria="pieceTitle" />
          </div>
          <div class="transport-center">
            <button id="play" class="btn btn-primary btn-sm transport-play" type="button" aria-label="Play"></button>
            <label class="speed">
              <span class="sr-only" data-i18n="speed"></span>
              <input id="speed" class="range range-xs range-primary" type="range" min="0.6" max="1.2" step="0.05" value="1" data-i18n-aria="speed" />
              <span id="speedLabel"></span>
            </label>
            <div class="dropdown">
              <button id="rangeLabel" class="btn btn-ghost btn-sm" type="button"></button>
              <div tabindex="0" class="dropdown-content range-panel">
                <label><span data-i18n="fromMeasure"></span> <input id="fromMeasure" class="input input-bordered input-sm" type="number" min="1" value="1" /> <span data-i18n="measureWord"></span></label>
                <label><span data-i18n="toMeasure"></span> <input id="toMeasure" class="input input-bordered input-sm" type="number" min="1" value="1" /> <span data-i18n="measureWord"></span></label>
              </div>
            </div>
          </div>
          <div class="transport-end">
            <div class="join" role="group" data-i18n-aria="practice">
              <button id="follow" class="btn btn-sm join-item" type="button" aria-label="Follow"></button>
              <button id="record" class="btn btn-sm join-item" type="button" aria-label="Record"></button>
            </div>
            <div class="tooltip tooltip-bottom" data-i18n-tip="jianpuTip">
              <button id="jianpuToggle" class="btn btn-ghost btn-sm btn-square" type="button" aria-pressed="true" data-i18n-aria="jianpuLabel"></button>
            </div>
            <div class="tooltip tooltip-bottom" data-i18n-tip="readTip">
              <button id="readToggle" class="btn btn-ghost btn-sm btn-square" type="button" aria-pressed="false" data-i18n-aria="readLabel"></button>
            </div>
            <div class="dropdown dropdown-end">
              <div class="tooltip tooltip-bottom" data-i18n-tip="more">
                <button id="moreMenu" class="btn btn-ghost btn-sm btn-square" type="button" data-i18n-aria="more"></button>
              </div>
              <ul tabindex="0" class="dropdown-content menu more-menu">
                <li>
                  <div class="menu-zoom" role="group" data-i18n-aria="zoom">
                    <button id="zoomOut" class="btn btn-ghost btn-xs btn-square" type="button" data-i18n-aria="zoomOut"></button>
                    <span id="zoomLabel">100%</span>
                    <button id="zoomIn" class="btn btn-ghost btn-xs btn-square" type="button" data-i18n-aria="zoomIn"></button>
                  </div>
                </li>
                <li><button id="askMark" type="button" aria-pressed="false"></button></li>
                <li id="photoToggleItem" hidden><button id="photoToggle" type="button" aria-pressed="false"></button></li>
                <li><button id="clearMarks" type="button"></button></li>
                <li id="pageManageItem" hidden><button id="pageManage" type="button"></button></li>
                <li class="menu-rule" aria-hidden="true"></li>
                <li><button id="exportPiece" type="button"></button></li>
                <li><button id="revealPiece" type="button"></button></li>
                <li class="menu-rule" aria-hidden="true"></li>
                <li id="deleteItem"><button id="removePiece" class="text-error" type="button"></button></li>
                <li id="deleteConfirm" hidden>
                  <div class="delete-confirm">
                    <p data-i18n="confirmDelete"></p>
                    <div>
                      <button id="confirmRemove" class="btn btn-error btn-xs" type="button"></button>
                      <button id="cancelRemove" class="btn btn-ghost btn-xs" type="button"></button>
                    </div>
                  </div>
                </li>
              </ul>
            </div>
          </div>
        </div>
        <div id="followBanner" hidden>
          <p id="followPrompt"></p>
          <p class="follow-keys-hint" data-i18n="followKeys"></p>
        </div>
        <div id="stage">
          <div id="desk">
            <aside id="photoPane" hidden>
              <div class="pane-head">
                <h2 data-i18n="photo"></h2>
                <div id="photoPager" class="photo-pager" hidden>
                  <button id="photoPrev" class="btn btn-ghost btn-xs" type="button"></button>
                  <span id="photoPageLabel"></span>
                  <button id="photoNext" class="btn btn-ghost btn-xs" type="button"></button>
                </div>
              </div>
              <div id="photoFrame">
                <img id="photo" alt="" data-i18n-aria="photo" />
              </div>
            </aside>
            <div id="scorePane">
              <p id="askHint" class="hint" hidden data-i18n="askHint"></p>
              <div id="scoreSheet">
                <div id="score"></div>
                <div id="scoreBox" hidden></div>
                <div id="askBubble" class="ask-bubble" hidden>
                  <div class="ask-bubble-bar">
                    <strong data-i18n="explanation"></strong>
                    <button id="askBubbleClose" class="btn btn-ghost btn-xs btn-circle" type="button" data-i18n-aria="closeExplanation">×</button>
                  </div>
                  <p id="askBubbleText"></p>
                </div>
              </div>
            </div>
          </div>
          <aside id="readSheet" hidden>
            <div class="read-head">
              <h2 data-i18n="howToRead"></h2>
              <button id="readClose" class="btn btn-ghost btn-xs btn-circle" type="button" data-i18n-aria="close">×</button>
            </div>
            <div id="facts"></div>
            <section id="askHistory">
              <h2 data-i18n="askedMarks"></h2>
              <p id="askHistoryEmpty" class="empty" data-i18n="askedEmpty"></p>
              <ol id="askHistoryList"></ol>
            </section>
            <details>
              <summary data-i18n="commonMarks"></summary>
              <div id="glossary"></div>
            </details>
          </aside>
        </div>
        <div id="editor" hidden>
          <section id="selection">
            <div class="editor-note">
              <p id="selectionName"></p>
              <p id="dotHint" class="hint" hidden></p>
            </div>
            <div class="join" role="group" data-i18n-aria="pitchGroup">
              <button id="down" class="btn btn-sm join-item" type="button"></button>
              <button id="up" class="btn btn-sm join-item" type="button"></button>
            </div>
            <div class="join" id="durations" role="group" data-i18n-aria="durationGroup"></div>
            <div class="editor-actions">
              <button id="askNote" class="btn btn-sm btn-soft" type="button"></button>
              <button id="removeNote" class="btn btn-ghost btn-sm text-error" type="button"></button>
            </div>
          </section>
        </div>
        <div id="reviewBar" hidden>
          <section id="review">
            <p id="reviewSummary"></p>
            <ul id="reviewExtras"></ul>
          </section>
        </div>
        <div id="keyboard" hidden>
          <div class="hand-legend" data-i18n-aria="legend"><span class="right" data-i18n="rightHand"></span><span class="left" data-i18n="leftHand"></span></div>
          <div id="keysHost"></div>
        </div>
      </section>
    </div>
    <dialog id="pageImport" class="modal">
      <div class="modal-box page-dialog">
        <h3 data-i18n="importTitle"></h3>
        <p class="hint" data-i18n="importHint"></p>
        <label class="page-title-field"><span data-i18n="titleField"></span>
          <input id="pageImportTitle" class="input input-bordered input-sm" maxlength="40" />
        </label>
        <ol id="pageImportList" class="page-draft"></ol>
        <div class="page-dialog-actions">
          <button id="pageImportAdd" class="btn btn-sm" type="button"></button>
          <button id="pageImportCancel" class="btn btn-ghost btn-sm" type="button"></button>
          <button id="pageImportStart" class="btn btn-primary btn-sm" type="button"></button>
        </div>
      </div>
      <form method="dialog" class="modal-backdrop"><button type="submit" data-i18n="close"></button></form>
    </dialog>
    <dialog id="pageManager" class="modal">
      <div class="modal-box page-dialog">
        <h3 data-i18n="pagesTitle"></h3>
        <p class="hint" data-i18n="pagesHint"></p>
        <ol id="pageManagerList" class="page-draft"></ol>
        <div class="page-dialog-actions">
          <button id="pageManagerClose" class="btn btn-sm" type="button"></button>
        </div>
      </div>
      <form method="dialog" class="modal-backdrop"><button type="submit" data-i18n="close"></button></form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
